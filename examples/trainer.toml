# trainer.toml
# IMPORTANT: keep this output_dir in sync with orchestrator.toml and inference.toml
output_dir = "checkpoints_tictactoe"

[model]
name = "hallerite/Qwen2.5-7B-TTT"

[model.experimental.lora]
rank = 8
alpha = 16
dropout = 0.0
target_modules = "all-linear"

[optim]
lr = 5e-5
weight_decay = 0.0

[ckpt]
interval = 10
weights.save_adapter_separately = false

[weight_broadcast]
type = "filesystem"
adapter_only = false

[wandb]
project = "ludic-tictactoe"
name = "qwen-7b-lora-run-1"
