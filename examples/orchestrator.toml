# --- General Settings ---
# IMPORTANT: keep this output_dir in sync with trainer.toml and inference.toml
output_dir = "/home/stranger/checkpoints_tictactoe/run_default"
num_train_workers = 1
max_steps = 100
lora_name = "r8-a16"

# --- Ludic Specifics ---
env_kind = "tictactoe_agent_starts"
protocol_kind = "single_agent_xml"
max_steps_per_episode = 5
rollout_concurrency = 64

# GRPO / Batch Settings
batch_size = 8
rollouts_per_example = 8
seq_len = 1024

# --- Inference Infrastructure (The vLLM Server) ---
[client]
base_url = ["http://127.0.0.1:8000/v1"]

[weight_broadcast]
type = "filesystem"

# --- Sampling Parameters ---
[sampling]
temperature = 1.0      # High temp for exploration in RL
max_tokens = 512
